name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /exam-cleaner/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-pages-build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser regression at the Pages path
        env:
          APP_URL: http://127.0.0.1:4174/exam-cleaner/
          PAGES_QA: '1'
        run: |
          npm run preview -- --port 4174 --strictPort > /tmp/exam-cleaner-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$APP_URL" > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-qa.mjs
          node scripts/migration-qa.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
